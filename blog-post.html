<script>

const sb=createClient('https://artqzjmizytoxxaqzadw.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFydHF6am1penl0b3h4YXF6YWR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MjE2MDQsImV4cCI6MjA5MTE5NzYwNH0.dVluFoXQGAKKFUL894F-R-VoITCD14vVJ6R2YyGiYzE');

const SEED={
  id:'seed-what-is-nagpur-rent',slug:'what-is-nagpur-rent',
  title:'What is nagpur.rent?',category:'About',emoji:'🍊',
  author:'nagpur.rent Team',date:'April 2025',
  excerpt:'A community-built rent map for Nagpur where real residents anonymously share what they actually pay.',
  content:`<p>If you've ever moved to a new neighbourhood in Nagpur and asked a broker "what's the going rate for a 2BHK here?" — you already know the problem. The number they give you is whatever they think you'll pay, not what the market actually is.</p>
<h2>The problem with rent in India</h2>
<p>Rent information in Indian cities is completely opaque. Unlike buying property — where sale prices are somewhat registered — rental prices exist entirely off the record. There's no public database, no registry. The only people who consistently know real prices are brokers, and they have every incentive to keep that information to themselves.</p>
<p>The result? Tenants negotiate blind. New residents have no reference point. People pay 20–30% above market rate simply because they didn't know better.</p>
<h2>What is nagpur.rent?</h2>
<p>nagpur.rent is a community rental price map for Nagpur. Residents drop a pin on the map at their location and share what they actually pay — anonymously. No login, no account, no personal details required.</p>
<p>The result is a growing, crowdsourced database of real rental prices across Nagpur's neighbourhoods — visible to anyone on the map.</p>
<h2>What can you do on it?</h2>
<ul>
<li><strong>See real rents</strong> — blue pins are gated societies, orange are non-gated. Each shows BHK type and monthly rent.</li>
<li><strong>Check your percentile</strong> — tap any pin to see how that rent compares to all other pins in the same BHK category city-wide.</li>
<li><strong>Flat Hunt</strong> — looking for a flat? Drop a seeker pin, get found by landlords and residents.</li>
<li><strong>Live Stats</strong> — city average, BHK-wise breakdown, gated vs non-gated premium, cheapest and most expensive areas.</li>
<li><strong>Naka Alert</strong> — report police checkpoints across the city. Community-verified, auto-expires in 7 days.</li>
</ul>
<h2>Who built this?</h2>
<p>nagpur.rent was built by Murtaza Rangwala, a performance marketing expert based in Nagpur. He built it as a side project — believing Nagpur deserved a community-powered rent map.</p>
<h2>Is it free?</h2>
<p>Yes, completely. No ads, no subscriptions, no broker fees. The map runs on community participation — the more people add their rent, the more useful it becomes for everyone.</p>
<h2>How do I contribute?</h2>
<p>Open the map at <a href="/">nagpur.rent</a>, tap <strong>Add My Rent</strong>, drop a pin on your location, and fill in your rent details. Takes about 30 seconds. No login required. Your data is anonymised — we don't collect names for rent pins.</p>
<p>The more Nagpurkars add their rent, the harder it becomes for brokers to overcharge the next person. That's the whole point.</p>`
};

function getSlug(){
  const path=window.location.pathname;
  const parts=path.split('/').filter(Boolean);
  if(parts[0]==='blog'&&parts[1])return parts[1];
  return new URLSearchParams(window.location.search).get('slug')||'';
}

async function init(){
  const slug=getSlug();
  if(!slug){window.location.href='/blog.html';return;}

  let post=null;
  if(slug===SEED.slug){post=SEED;}
  else{
    const{data}=await sb.from('blog_posts').select('*').eq('slug',slug).eq('published',true).single();
    post=data;
  }

  if(!post){
    document.getElementById('loading').innerHTML='<p style="color:var(--td);font-size:16px;">Post not found. <a href="/blog.html" style="color:var(--orange2);">View all posts →</a></p>';
    return;
  }

  const pageUrl=`https://nagpur.rent/blog/${post.slug||slug}`;
  const metaTitle=`${post.title} | nagpur.rent Blog`;
  const metaDesc=post.excerpt||post.meta_desc||`Read ${post.title} on nagpur.rent — Nagpur's community rental platform.`;

  document.title=metaTitle;
  document.querySelector('meta[name="description"]').content=metaDesc;
  document.getElementById('canonical').href=pageUrl;
  document.getElementById('og-title').content=metaTitle;
  document.getElementById('og-desc').content=metaDesc;
  document.getElementById('og-url').content=pageUrl;
  if(post.og_image||post.cover_image){
    const m=document.createElement('meta');m.property='og:image';m.content=post.og_image||post.cover_image;
    document.head.appendChild(m);
  }

  document.getElementById('post-hero').textContent=post.emoji||'✍️';
  document.getElementById('bc-title').textContent=post.title;

  const fmtDate=ts=>ts?new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}):post.date||'';

  document.getElementById('post-content').innerHTML=`
    <div class="post-tag">${post.category||'Article'}</div>
    <h1>${esc(post.title)}</h1>
    <div class="post-meta">
      <span>✍️ ${post.author||'nagpur.rent'}</span>
      <span>📅 ${post.date||fmtDate(post.created_at)}</span>
    </div>
    <div class="post-body">${post.content||''}</div>
    <div class="cta-box">
      <div class="cta-title">🍊 Try nagpur.rent</div>
      <div class="cta-sub">See real rents across Nagpur. Add yours in 30 seconds. No login required.</div>
      <a href="/" class="btn-cta">Open the Map →</a>
    </div>`;

  document.getElementById('loading').style.display='none';
  document.getElementById('page-content').style.display='block';
  gtag('event','post_view',{post_id:post.id,slug});
}

function toggleNav(){const d=document.getElementById('nav-dd');d.style.display=d.style.display==='block'?'none':'block';}
document.addEventListener('click',e=>{if(!document.getElementById('site-nav').contains(e.target))document.getElementById('nav-dd').style.display='none';});
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
init();
</script>
